name: Keep-alive

# Supabase Free pauses a project after a week of inactivity. /api/health runs one DB query (D17).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "APP_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 30 "$APP_URL/api/health"
