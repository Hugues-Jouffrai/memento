# Cases for the link stage (R-KB-12): a new page (title and summary) and the shortlisted candidate pages (title and summary).
# link: candidates that MUST be linked (matched by title). ok: candidates a link to which is acceptable but not required.
# Any other link is a FALSE LINK, the costly error. Traps (link: [] and ok: []) are candidates that share a field with the
# new page without a specific connection. Summaries are written for this eval; the model must judge only from what they say.
cases:
