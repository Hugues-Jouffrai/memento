  - id: social-war-caracalla
    new:
      title: La guerre sociale
      summary:
        - "La guerre sociale (91-88 av. J.-C.) oppose Rome à ses alliés italiens, qui réclament la citoyenneté romaine."
        - "La loi Julia de 90 av. J.-C. accorde la citoyenneté aux alliés restés fidèles."
    candidates:
      - { title: L'édit de Caracalla, summary: ["En 212, l'édit de Caracalla accorde la citoyenneté romaine à presque tous les hommes libres de l'Empire.", "Il achève l'extension progressive de la citoyenneté."] }
      - { title: L'Empire inca, summary: ["L'Empire inca s'étend le long des Andes avec Cuzco pour capitale.", "Il tombe après la conquête espagnole."] }
    link: [L'édit de Caracalla]
    ok: []

